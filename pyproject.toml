[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dnd-cards"
version = "0.1.0"
description = "Generiert druckfertige DnD-Aktions- und Zauberkarten als PDF aus JSON-Dateien oder UI-Eingaben."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "weasyprint>=61",
    "jinja2>=3.1",
    "pydantic>=2.6",
]

[project.optional-dependencies]
ui = ["streamlit>=1.32"]
dev = ["pytest>=8.0"]

[project.scripts]
dnd-cards = "dndcards.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dndcards = ["templates/*.j2", "static/*.css"]
